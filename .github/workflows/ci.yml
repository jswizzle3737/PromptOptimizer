name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests, browser tests, and package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System tools
        run: |
          missing=()
          command -v zip >/dev/null || missing+=(zip)
          command -v unzip >/dev/null || missing+=(unzip)
          if ! ldconfig -p | grep -q 'libatomic\.so\.1'; then
            missing+=(libatomic1)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          # Active LTS (Lithium). The action reuses a cached 26.x toolchain.
          # This repo has no package.json, so npm dependency caching does not apply.
          node-version: "26"

      - name: Unit tests
        run: node --no-warnings --test "unit/*.test.mjs"

      - name: DOM and contrast checks
        run: |
          node check_dom_contract.selftest.js
          node check_dom_contract.js
          node check_contrast.js

      - name: Install Chrome for Testing
        run: |
          browser_url="$(curl --fail --silent --show-error --retry 3 \
            https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | node -e 'const {channels} = JSON.parse(require("node:fs").readFileSync(0, "utf8")); process.stdout.write(channels.Stable.downloads.chrome.find(entry => entry.platform === "linux64").url)')"
          curl --fail --silent --show-error --retry 3 --location "$browser_url" --output "$RUNNER_TEMP/chrome-for-testing.zip"
          unzip -q "$RUNNER_TEMP/chrome-for-testing.zip" -d "$RUNNER_TEMP"
          printf 'BROWSER_PATH=%s\n' "$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: Browser tests
        run: node test_extension.js
        timeout-minutes: 10

      - name: Package the extension
        run: node package.mjs

      - name: Validate manifest and zip
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const raw = readFileSync('manifest.json', 'utf8');
          let manifest;
          try {
            manifest = JSON.parse(raw);
          } catch (err) {
            console.error(`manifest.json is not valid JSON: ${err.message}`);
            process.exit(1);
          }

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          if (!manifest || typeof manifest !== 'object' || Array.isArray(manifest)) {
            fail('manifest.json must be a JSON object');
          }
          if (manifest.manifest_version !== 3) {
            fail(`manifest_version must be 3, got ${manifest.manifest_version}`);
          }
          if (typeof manifest.name !== 'string' || manifest.name.trim() === '') {
            fail('manifest name must be a non-empty string');
          }
          if (typeof manifest.version !== 'string' || !/^\d+\.\d+\.\d+$/.test(manifest.version)) {
            fail(`manifest version must be MAJOR.MINOR.PATCH, got ${manifest.version}`);
          }

          const zip = `dist/promptoptimizer-${manifest.version}.zip`;
          const tested = spawnSync('unzip', ['-t', zip], { encoding: 'utf8' });
          if (tested.status !== 0) {
            fail(tested.stderr || tested.stdout || `unzip -t failed for ${zip}`);
          }
          const packed = spawnSync('unzip', ['-p', zip, 'manifest.json'], { encoding: 'utf8' });
          if (packed.status !== 0) {
            fail(`${zip} does not contain manifest.json`);
          }
          let packedManifest;
          try {
            packedManifest = JSON.parse(packed.stdout);
          } catch (err) {
            fail(`packaged manifest.json is not valid JSON: ${err.message}`);
          }
          if (
            packedManifest.manifest_version !== manifest.manifest_version ||
            packedManifest.name !== manifest.name ||
            packedManifest.version !== manifest.version
          ) {
            fail('packaged manifest.json does not match the source manifest');
          }
          console.log(`manifest.json valid (MV3 ${manifest.name} ${manifest.version}); ${zip} ok`);
          EOF

  release:
    name: Publish versioned GitHub release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: promptoptimizer-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Publish ZIP for a new manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          if ! command -v zip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi
          node package.mjs
          gh release create "$tag" "dist/promptoptimizer-$version.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PromptOptimizer $version" --generate-notes
