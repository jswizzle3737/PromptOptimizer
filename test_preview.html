<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PromptOptimizer Live Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B0F19;
      color: #F1F5F9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 14px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #FFFFFF;
    }
    p {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #0B0F19;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #FFFFFF;
      padding: 12px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
    }
    textarea:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .hint {
      font-size: 12px;
      color: #10B981;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>PromptOptimizer Interactive Test</h1>
    <p>Click inside the textarea below or press <kbd>Alt</kbd>+<kbd>O</kbd> to see the floating PromptOptimizer trigger and modal.</p>
    <textarea id="prompt-textarea" placeholder="Type a prompt here (e.g., 'write a python web scraper')..."></textarea>
    <div class="hint">✦ The PromptOptimizer button will appear above the top-right of this box!</div>
  </div>
</body>
</html>
